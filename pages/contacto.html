<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./../assets/styles/variables.css" />
    <link rel="stylesheet" href="./../assets/styles/footer.css" />
    <link rel="stylesheet" href="./../assets/styles/contacto.css" />
    <link rel="stylesheet" href="./../assets/styles/navbar.css" />
    
  </head>

  <body>
    <div id="navbar-placeholder"></div>
    <main>
      <section id="contacto" class="contact-section py-5">
        <div class="container">
          <div class="row g-5 align-items-center">
            <!-- Información -->
            <div class="col-lg-5">
              <div class="contact-info">
                <span class="contact-subtitle"> Contáctanos </span>

                <h2 class="contact-title">Estamos listos para ayudarte</h2>

                <p class="contact-description">
                  Ponte en contacto con nuestro equipo para resolver tus dudas
                  sobre envíos, logística o cualquier servicio que ofrecemos.
                </p>

                <div class="contact-item">
                  <i class="bi bi-geo-alt-fill"></i>
                  <span>Medellín, Colombia</span>
                </div>

                <div class="contact-item">
                  <i class="bi bi-telephone-fill"></i>
                  <span>+57 300 123 4567</span>
                </div>

                <div class="contact-item">
                  <i class="bi bi-envelope-fill"></i>
                  <span>info@generationexpress.com</span>
                </div>
              </div>
            </div>

            <!-- Formulario -->
            <div class="col-lg-7">
              <div class="contact-form-container">
                <form class="contact-form" action="https://formspree.io/f/xjgqvegj" method="POST">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <input
                        type="text"
                        name="nombre"
                        class="form-control contact-input"
                        placeholder="Nombre completo"
                        required
                      />
                    </div>

                    <div class="col-md-6">
                      <input
                        type="email"
                        name="email"
                        class="form-control contact-input"
                        placeholder="Correo electrónico"
                        required
                      />
                    </div>

                    <div class="col-12">
                      <input
                        type="text"
                        name="asunto"
                        class="form-control contact-input"
                        placeholder="Asunto"
                        required
                      />
                    </div>

                    <div class="col-12">
                      <textarea
                        name="mensaje"
                        class="form-control contact-input"
                        rows="6"
                        placeholder="Escribe tu mensaje..."
                        required
                      ></textarea>
                    </div>

                    <div class="col-12">
                      <button type="submit" class="btn contact-btn">
                        Enviar Mensaje
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div id="footer-placeholder"></div>

    <script src="../js/components/load-components.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/contacto.js"></script>
  </body>
</html>
