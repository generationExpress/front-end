<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/styles/variables.css">
    <link rel="stylesheet" href="../assets/styles/login.css">
    
</head>
<body>
    <div id="navbar-placeholder"></div>
    
    <div class="form-container">
        <h2>Crear Cuenta</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="correo" class="form-label">Correo Electrónico</label>
                <input type="email" id="correo" class="form-control" placeholder="ejemplo@correo.com" required>
                <div class="error-message" id="errorCorreo"></div>
            </div>

            <div class="form-group">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input type="password" id="contrasena" class="form-control" placeholder="Ingrese su contraseña" required>
                <div class="error-message" id="errorContrasena"></div>
            </div>

            <button type="submit" class="btn-login">Iniciar Sesión</button>
            <button type="submit" class="btn-login">Crear Cuenta</button>
            <div class="success-message" id="successMessage">¡Datos guardados correctamente!</div>
        </form>
    </div>
    <div id="footer-placeholder"></div>

    <script src="../js/components/load-components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
