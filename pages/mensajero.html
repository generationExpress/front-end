<!DOCTYPE html>
<html lang="es">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="./../assets/styles/variables.css" />
    <link rel="stylesheet" href="./../assets/styles/footer.css" />
    <link rel="stylesheet" href="./../assets/styles/contacto.css" />
    <link rel="stylesheet" href="./../assets/styles/navbar.css" />
    <link rel="stylesheet" href="./../assets/styles/mensajero.css" />

    <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
  </head>
<body>
  

  <div id="navbar-placeholder"></div>

  <div class="app-container container my-5">
    <div class="row gy-4">
      
      <aside class="col-12 col-lg-4">
        <div class="panel">
          <header class="panel__header">
            <div class="panel__info">
              <h2 class="panel__title">Entregas Pendientes</h2>
              <p class="panel__chofer">Carlos Garcia</p>
            </div>
            <div class="panel__avatar">CG</div>
          </header>

          <section class="progreso">
            <div class="progreso__texto">
              <span>20% completado</span>
              <span class="progreso__pendiente">4 pendientes</span>
            </div>
            <div class="progreso__barra-bg">
              <div class="progreso__barra-fill" style="width: 20%;"></div>
            </div>
            <div class="progreso__estado">1/5 entregados</div>
          </section>

          <div class="panel__lista">
            <!-- El JS inyectará las tarjetas pendientes aquí -->
          </div>
        </div>
      </aside>

      <main class="col-12 col-lg-8">
        <h2 class="titulo-lista mb-4">Pedidos Entregados</h2>

        <div class="lista-grid">
          <!-- El JS inyectará las tarjetas entregadas aquí -->
        </div>
    </div>
  </div>

  <div class="modal fade" id="modal-detalle" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Navegación GPS</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center p-4">
          <span class="material-symbols-outlined text-primary mb-3" style="font-size: 3rem;">navigation</span>
          <p class="mb-0">Iniciando ruta en el navegador satelital...</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Actualizar Estado -->
  <div class="modal fade" id="modal-actualizar-estado" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Actualizar Estado</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="estado-order-id">
          <div class="mb-3">
            <label class="form-label">Estado</label>
            <select class="form-select" id="estado-select-modal">
              <option value="PENDING">Pendiente</option>
              <option value="ASSIGNED">Asignado</option>
              <option value="IN_TRANSIT">En tránsito</option>
              <option value="DELIVERED">Entregado</option>
              <option value="CANCELLED">Cancelado</option>
              <option value="RESCHEDULED">Reprogramado</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Observaciones</label>
            <textarea class="form-control" id="estado-observaciones" rows="3" placeholder="Escribe observaciones aquí..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btn-submit-estado">Actualizar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Entregar -->
  <div class="modal fade" id="modal-entregar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Registrar Entrega</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="entregar-order-id">
          <div class="mb-3">
            <label class="form-label">Nombre de quien recibe</label>
            <input type="text" class="form-control" id="entregar-receptor" placeholder="Ej: Carlos Ramirez">
          </div>
          <div class="mb-3">
            <label class="form-label">Foto de entrega (URL o Archivo)</label>
            <input type="text" class="form-control" id="entregar-foto" placeholder="https://example.com/photos/delivery-001.jpg" value="https://example.com/photos/delivery-001.jpg">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-success" id="btn-submit-entrega">Confirmar Entrega</button>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="../js/components/load-components.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
    <script src="../js/services/apiService.js"></script>
    <script src="../js/mensajero.js"></script>

</body>

</html>
